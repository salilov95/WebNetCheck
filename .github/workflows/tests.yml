name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine dependencies
        run: python -m pip install dnspython cryptography
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python cli.py --list-profiles
      # Needs the internet and third-party services, so it never fails the build.
      - name: Network smoke test
        continue-on-error: true
        run: |
          python cli.py --myip
          python cli.py https://example.com/ --only extip,dns,icmp,tcp,tls,http
